<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NRPay - Log In</title>
    <!-- FontAwesome Icons के लिए -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f7f7f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            padding: 30px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            position: relative;
        }

        .login-title {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            font-size: 16px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 15px 14px 45px;
            background-color: #f9f9f9;
            border: 1px solid #eee;
            border-radius: 8px;
            font-size: 15px;
            color: #333;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: #bbb;
            background-color: #fff;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background-color: #111;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            letter-spacing: 1px;
            transition: background 0.3s ease;
        }

        .login-btn:hover {
            background-color: #333;
        }

        /* रजिस्टर पेज पर जाने के लिए नीचे लिंक */
        .register-link-container {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        .register-link-container a {
            color: #111;
            font-weight: bold;
            text-decoration: none;
        }

        .register-link-container a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-title">LOG IN</div>
        
        <form id="loginForm">
            <!-- Phone Number Field -->
            <div class="input-group">
                <i class="fa-solid fa-phone"></i>
                <input type="tel" id="loginPhone" placeholder="Enter Your Phone Number" required>
            </div>

            <!-- Password Field -->
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="loginPassword" placeholder="Enter Password" required>
            </div>

            <!-- Login Button -->
            <button type="submit" class="login-btn">LOG IN</button>
        </form>

        <!-- Register Page Link -->
        <div class="register-link-container">
            Don't have an account? <a href="register.html">Register</a>
        </div>
    </div>

    <script>
        // पेज खुलते ही पुराना सारा लोकल डेटा साफ़ कर दें ताकि दो अलग यूजर्स का डेटा आपस में मिक्स न हो
        window.onload = function() {
            // यदि आप चाहें तो पुराना इनपुट खाली रख सकते हैं ताकि फ्रेश लॉगिन हो
            localStorage.removeItem('userUid');
            localStorage.removeItem('userPhone');
        };

        // लॉगिन फॉर्म सबमिट होने पर
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const phone = document.getElementById('loginPhone').value;
            const password = document.getElementById('loginPassword').value;

            try {
                // आपके Render लाइव बैकएंड सर्वर पर API कॉल
                const response = await fetch('https://rn-pay.onrender.com/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, password })
                });

                const data = await response.json();

                if (data.success) {
                    // सबसे पहले पुराना सारा लोकल स्टोरेज साफ़ करें
                    localStorage.clear();

                    // अब सिर्फ इस नए लॉगिन हुए यूजर का सटीक डेटा सेव करें
                    localStorage.setItem('userUid', data.uid);       // MongoDB से आया हुआ इसका अपना यूनिक UID
                    localStorage.setItem('userPhone', data.phone);   // इसका अपना फोन नंबर
                    
                    alert("लॉगिन सफल रहा!");
                    
                    // डैशबोर्ड पर रीडायरेक्ट करें जहाँ MongoDB से इसी UID का फ्रेश डेटा लोड होगा
                    window.location.href = "dashboard.html";
                } else {
                    alert(data.message || "Login failed! Incorrect phone or password.");
                }
            } catch (error) {
                console.error("Error:", error);
                alert("सर्वर से कनेक्ट करने में समस्या आ रही है। कृपया दोबारा कोशिश करें।");
            }
        });
    </script>

</body>
</html>
