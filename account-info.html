<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Info</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #f7f7f7; color: #111; padding-bottom: 40px; }

        /* हेडर */
        .header { background: #fff; padding: 16px 20px; display: flex; align-items: center; border-bottom: 1px solid #f0f0f0; position: sticky; top: 0; z-index: 100; }
        .back-btn { font-size: 18px; color: #111; text-decoration: none; margin-right: 15px; }
        .header-title { font-size: 17px; font-weight: 600; flex: 1; text-align: center; margin-right: 28px; }

        .container { width: 92%; max-width: 480px; margin: 20px auto; display: flex; flex-direction: column; gap: 15px; }

        /* प्रोफाइल अवतार */
        .avatar-section { display: flex; justify-content: center; align-items: center; margin-bottom: 10px; }
        .avatar-box { width: 80px; height: 80px; background: #e5e7eb; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: #6b7280; font-size: 40px; }

        /* इन्फो कार्ड */
        .info-card { background: #fff; border-radius: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); overflow: hidden; display: flex; flex-direction: column; }
        .info-item { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; text-decoration: none; color: #111; border-bottom: 1px solid #f9f9f9; background: #fff; cursor: pointer; transition: 0.2s; }
        .info-item:last-child { border-bottom: none; }
        .info-item:active { background: #f9f9f9; }
        .info-label { font-size: 15px; font-weight: 500; color: #333; }
        .info-value { font-size: 14px; color: #666; display: flex; align-items: center; gap: 8px; }

        /* फॉर्म / पेज व्यू (पासवर्ड, पिन बदलने के लिए) */
        .sub-page { display: none; background: #fff; border-radius: 14px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); flex-direction: column; gap: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 13px; font-weight: 600; color: #555; }
        .form-input { padding: 14px; border: 1px solid #ddd; border-radius: 10px; font-size: 15px; outline: none; transition: 0.2s; background: #fafafa; }
        .form-input:focus { border-color: #111; background: #fff; }
        
        .submit-btn { background: #111; color: white; padding: 15px; border-radius: 25px; font-weight: 600; font-size: 16px; border: none; cursor: pointer; text-align: center; margin-top: 10px; }

        /* 6-बॉक्स पिन लेआउट */
        .pin-boxes { display: flex; justify-content: space-between; gap: 6px; }
        .pin-box { width: 42px; height: 48px; border: 1px solid #ddd; border-radius: 8px; text-align: center; font-size: 20px; font-weight: bold; background: #fafafa; display: flex; align-items: center; justify-content: center; }

        /* न्यूमेरिक कीबोर्ड (पिन के लिए) */
        .numeric-keyboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; background: #eee; padding: 10px; border-radius: 12px; margin-top: 10px; }
        .key-btn { background: #fff; padding: 14px; border-radius: 8px; font-size: 18px; font-weight: 600; text-align: center; cursor: pointer; border: none; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .key-btn:active { background: #ddd; }
    </style>
</head>
<body>

    <!-- हेडर -->
    <div class="header">
        <a href="profile.html" class="back-btn"><i class="fas fa-chevron-left"></i></a>
        <div class="header-title" id="pageTitle">Account Info</div>
    </div>

    <div class="container">
        
        <!-- मेन अकाउंट इन्फो व्यू -->
        <div id="mainInfoView" style="display: flex; flex-direction: column; gap: 15px;">
            <div class="avatar-section">
                <div class="avatar-box"><i class="fas fa-user"></i></div>
            </div>

            <div class="info-card">
                <div class="info-item" style="cursor: default;">
                    <span class="info-label">ID</span>
                    <span class="info-value" id="displayUID" style="font-weight: 600; color: #111;">20001</span>
                </div>
                <div class="info-item" style="cursor: default;">
                    <span class="info-label">Phone</span>
                    <span class="info-value" id="displayPhone">7628950634</span>
                </div>
                <div class="info-item" onclick="showSubPage('passwordPage')">
                    <span class="info-label">Password</span>
                    <span class="info-value">****** <i class="fas fa-chevron-right" style="font-size: 12px;"></i></span>
                </div>
                <div class="info-item" onclick="showSubPage('pinPage')">
                    <span class="info-label">PIN</span>
                    <span class="info-value"><i class="fas fa-chevron-right" style="font-size: 12px;"></i></span>
                </div>
                <div class="info-item" onclick="showSubPage('resetPinPage')">
                    <span class="info-label">Reset PIN</span>
                    <span class="info-value"><i class="fas fa-chevron-right" style="font-size: 12px;"></i></span>
                </div>
            </div>
        </div>

        <!-- 1. Change Password पेज -->
        <div id="passwordPage" class="sub-page">
            <div class="form-group">
                <label>Old Password</label>
                <input type="password" class="form-input" placeholder="Enter old password">
            </div>
            <div class="form-group">
                <label>New Password</label>
                <input type="password" class="form-input" placeholder="Enter new password">
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" class="form-input" placeholder="Confirm new password">
            </div>
            <button class="submit-btn" onclick="alert('Password updated successfully!'); goBackToMain();">Submit</button>
        </div>

        <!-- 2. Change PIN पेज -->
        <div id="pinPage" class="sub-page">
            <div class="form-group">
                <label>Old PIN</label>
                <div class="pin-boxes">
                    <div class="pin-box">•</div><div class="pin-box">•</div><div class="pin-box">•</div><div class="pin-box">•</div><div class="pin-box">•</div><div class="pin-box">•</div>
                </div>
            </div>
            <div class="form-group">
                <label>New PIN</label>
                <div class="pin-boxes">
                    <div class="pin-box"></div><div class="pin-box"></div><div class="pin-box"></div><div class="pin-box"></div><div class="pin-box"></div><div class="pin-box"></div>
                </div>
            </div>
            <div class="form-group">
                <label>Confirm PIN</label>
                <div class="pin-boxes">
                    <div class="pin-box"></div><div class="pin-box"></div><div class="pin-box"></div><div class="pin-box"></div><div class="pin-box"></div><div class="pin-box"></div>
                </div>
            </div>
            <button class="submit-btn" onclick="alert('PIN updated successfully!'); goBackToMain();">Submit</button>
        </div>

        <!-- 3. Reset PIN पेज (Google Auth के साथ) -->
        <div id="resetPinPage" class="sub-page">
            <div class="form-group">
                <label>Set PIN</label>
                <div class="pin-boxes">
                    <div class="pin-box"></div><div class="pin-box"></div><div class="pin-box"></div><div class="pin-box"></div><div class="pin-box"></div><div class="pin-box"></div>
                </div>
            </div>
            <div class="form-group">
                <label>Confirm PIN</label>
                <div class="pin-boxes">
                    <div class="pin-box"></div><div class="pin-box"></div><div class="pin-box"></div><div class="pin-box"></div><div class="pin-box"></div><div class="pin-box"></div>
                </div>
            </div>
            <div class="form-group">
                <label>Google Authentication Code</label>
                <input type="text" class="form-input" placeholder="Google Authentication Code">
            </div>
            <button class="submit-btn" onclick="alert('PIN reset successfully!'); goBackToMain();">Submit</button>
        </div>

    </div>

    <script>
        window.onload = function() {
            loadUserData();
        };

        function loadUserData() {
            // रजिस्टर्ड UID लोड करें
            let uid = localStorage.getItem('hoyo_permanent_uid') || "20001";
            document.getElementById('displayUID').innerText = uid;

            // यूजर का असली रजिस्टर्ड फोन नंबर लोड करें (जो लॉगिन/रजिस्ट्रेशन के वक्त सेव हुआ हो)
            let phone = localStorage.getItem('hoyo_user_phone') || "7628950634";
            document.getElementById('displayPhone').innerText = phone;
        }

        function showSubPage(pageId) {
            document.getElementById('mainInfoView').style.display = 'none';
            document.getElementById('passwordPage').style.display = 'none';
            document.getElementById('pinPage').style.display = 'none';
            document.getElementById('resetPinPage').style.display = 'none';

            document.getElementById(pageId).style.display = 'flex';

            if(pageId === 'passwordPage') document.getElementById('pageTitle').innerText = "Change Password";
            if(pageId === 'pinPage') document.getElementById('pageTitle').innerText = "PIN";
            if(pageId === 'resetPinPage') document.getElementById('pageTitle').innerText = "Reset PIN";
        }

        function goBackToMain() {
            document.getElementById('passwordPage').style.display = 'none';
            document.getElementById('pinPage').style.display = 'none';
            document.getElementById('resetPinPage').style.display = 'none';
            document.getElementById('mainInfoView').style.display = 'flex';
            document.getElementById('pageTitle').innerText = "Account Info";
        }
    </script>
</body>
</html>
