<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <!-- FontAwesome Icons के लिए -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f7f7f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .register-container {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            padding: 30px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .register-title {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 30px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            font-size: 16px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 15px 14px 45px;
            background-color: #f9f9f9;
            border: 1px solid #eee;
            border-radius: 8px;
            font-size: 15px;
            color: #333;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: #bbb;
            background-color: #fff;
        }

        /* इनवाइट कोड फील्ड जो एडिट नहीं होगी */
        .input-group input[readonly] {
            background-color: #f1f1f1;
            color: #888;
            cursor: not-allowed;
        }

        .register-btn {
            width: 100%;
            padding: 14px;
            background-color: #666;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s ease;
        }

        .register-btn:hover {
            background-color: #555;
        }

        /* लॉगिन लिंक के लिए स्टाइल */
        .login-link-container {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        .login-link-container a {
            color: #333;
            font-weight: bold;
            text-decoration: none;
        }

        .login-link-container a:hover {
            text-decoration: underline;
        }

        /* APK डाउनलोड पॉपअप मॉडल के लिए स्टाइल */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #ffffff;
            width: 90%;
            max-width: 340px;
            padding: 25px 20px;
            border-radius: 14px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            animation: scaleUp 0.3s ease;
        }

        @keyframes scaleUp {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-icon {
            font-size: 45px;
            color: #16a34a;
            margin-bottom: 15px;
        }

        .modal-title {
            font-size: 18px;
            font-weight: bold;
            color: #111;
            margin-bottom: 8px;
        }

        .modal-desc {
            font-size: 13px;
            color: #666;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .download-apk-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #111;
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            border-radius: 8px;
            margin-bottom: 10px;
            transition: background 0.2s;
        }

        .download-apk-btn:hover {
            background-color: #333;
        }

        .skip-login-btn {
            display: block;
            width: 100%;
            padding: 10px;
            background: transparent;
            color: #666;
            border: none;
            font-size: 13px;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="register-container">
        <div class="register-title">Register</div>
        
        <form id="registerForm">
            <!-- Phone Number Field -->
            <div class="input-group">
                <i class="fa-solid fa-phone"></i>
                <input type="tel" id="phone" placeholder="Phone" required>
            </div>

            <!-- Enter Password Field -->
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="password" placeholder="Enter Password" required>
            </div>

            <!-- Repeat Password Field -->
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="confirmPassword" placeholder="Repeat Password" required>
            </div>

            <!-- Auto-filled Invite Code Field (Read-only / Non-editable) -->
            <div class="input-group">
                <i class="fa-solid fa-envelope"></i>
                <input type="text" id="inviteCode" placeholder="Invite Code" readonly>
            </div>

            <!-- Register Button -->
            <button type="submit" class="register-btn">Register</button>
        </form>

        <!-- Login Page Link -->
        <div class="login-link-container">
            Already have an account? <a href="login.html">Login</a>
        </div>
    </div>

    <!-- एपीके डाउनलोड पॉपअप मॉडल -->
    <div id="downloadModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-icon"><i class="fa-solid fa-circle-check"></i></div>
            <div class="modal-title">Registration Successful!</div>
            <div class="modal-desc" id="successMsg">बधाई हो! आपका अकाउंट बन गया है। बेहतर अनुभव के लिए हमारा ऐप डाउनलोड करें।</div>
            <a href="https://www.webtonative.com/api/v1/demo/download/6a62273352d8bc6b85d5d66c/ANDROID?t=1784895569664" class="download-apk-btn" target="_blank">
                <i class="fa-solid fa-download"></i> Download App (APK)
            </a>
            <button class="skip-login-btn" onclick="goToLogin()">सीधे लॉगिन पर जाएं</button>
        </div>
    </div>

    <script>
        // यूआरएल से ऑटोमैटिक इनवाइट कोड कैप्चर करने का जावास्क्रिप्ट कोड
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const inviteCode = urlParams.get('invite');
            
            const inviteInput = document.getElementById('inviteCode');
            
            if (inviteCode) {
                inviteInput.value = inviteCode;
            } else {
                inviteInput.value = "20001"; // डिफ़ॉल्ट एडमिन का UID या कोड
            }
        };

        // फॉर्म सबमिट होने पर डेटा संभालने और बैकएंड पर भेजने के लिए
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const inviteCode = document.getElementById('inviteCode').value;

            if (password !== confirmPassword) {
                alert("Passwords do not match!");
                return;
            }

            try {
                // बैकएंड सर्वर पर रजिस्ट्रेशन की API कॉल
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, password, inviteCode })
                });

                const data = await response.json();

                if (data.success) {
                    // UID के साथ सक्सेस मैसेज सेट करें और पॉपअप दिखाएं
                    document.getElementById('successMsg').innerText = `सफलतापूर्वक रजिस्टर हो गया! आपका UID: ${data.uid || 'N/A'}. ऐप डाउनलोड करें।`;
                    document.getElementById('downloadModal').style.display = 'flex';
                } else {
                    alert(data.message || "Registration failed!");
                }
            } catch (error) {
                console.error("Error:", error);
                // अगर सर्वर से कनेक्ट न हो तो भी यूजर को सुविधा के लिए पॉपअप दिखा सकते हैं या अलर्ट दे सकते हैं
                alert("Error connecting to the server!");
            }
        });

        // लॉगिन पेज पर भेजने का फंक्शन
        function goToLogin() {
            window.location.href = "login.html";
        }
    </script>

</body>
</html>
